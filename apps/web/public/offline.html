<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta
			content="width=device-width, initial-scale=1, viewport-fit=cover"
			name="viewport"
		>
		<title>Sem Conexão // orc//desafios</title>
		<link href="/favicon/favicon.svg" rel="icon" type="image/svg+xml">
		<style>
		* {
			box-sizing: border-box;
			padding: 0;
			margin: 0;
		}
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 1.5rem;
			font-family:
				-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
				Arial, sans-serif;
			color: #f0f7ef;
			background-color: #080f07;
		}
		.card {
			width: 100%;
			max-width: 440px;
			padding: 2.25rem 1.75rem;
			text-align: center;
			background-color: #0f1d0d;
			border: 2px solid #1e3b1a;
			border-radius: 8px;
			box-shadow: 4px 4px 0px 0px #020602;
		}
		.logo-icon {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 54px;
			height: 54px;
			margin-bottom: 1.25rem;
			background-color: #02571e;
			border: 2px solid #1e3b1a;
			border-radius: 6px;
			box-shadow: 3px 3px 0px 0px #020602;
		}
		.tag {
			display: inline-block;
			padding: 4px 10px;
			margin-bottom: 1rem;
			font-size: 11px;
			font-weight: 900;
			color: #040d03;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			background-color: #3bc90c;
			border: 2px solid #1e3b1a;
			border-radius: 4px;
		}
		h1 {
			margin-bottom: 0.75rem;
			font-size: 1.35rem;
			font-weight: 900;
			color: #f0f7ef;
			text-transform: uppercase;
			letter-spacing: -0.02em;
		}
		p {
			margin-bottom: 1.75rem;
			font-size: 0.875rem;
			line-height: 1.5;
			color: #88b384;
		}
		.btn {
			display: inline-block;
			width: 100%;
			padding: 0.875rem 1.25rem;
			font-size: 0.8125rem;
			font-weight: 900;
			color: #040d03;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			text-decoration: none;
			cursor: pointer;
			background-color: #3bc90c;
			border: 2px solid #1e3b1a;
			border-radius: 6px;
			box-shadow: 3px 3px 0px 0px #020602;
			transition:
				transform 0.1s ease,
				box-shadow 0.1s ease;
		}
		.btn:active {
			box-shadow: 1px 1px 0px 0px #020602;
			transform: translate(2px, 2px);
		}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="logo-icon">
				<img alt="Orc'estra" height="42" src="/favicon/favicon.svg" width="42">
			</div>
			<br>
			<span class="tag">orc//desafios</span>
			<h1>Sem Conexão</h1>
			<p>
				Você está desconectado da internet. Conecte-se a uma rede Wi-Fi ou dados
				móveis para continuar sincronizando suas missões e desafios.
			</p>
			<button class="btn" onclick="window.location.reload()" type="button">
				TENTAR NOVAMENTE
			</button>
		</div>
	</body>
</html>
